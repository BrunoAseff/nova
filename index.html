<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A calm, customizable space to focus, relax, or just take a break."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Nova</title>
    <script>
      // Aplica tema e atmosfera antes da primeira pintura, para não piscar.
      (() => {
        let prefs;
        try {
          prefs = JSON.parse(localStorage.getItem("nova:preferences") ?? "null")?.state;
        } catch {}
        let theme = prefs?.theme;
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.atmosphere = "nevoa";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
